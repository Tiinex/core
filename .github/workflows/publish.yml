name: Publish npm
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    if: vars.TIINEX_ENABLE_NPM_PUBLISH == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run validate
      - id: release
        run: node tools/release-plan.mjs
      - name: Publish the tested archive through OIDC
        if: steps.release.outputs.publish == 'true'
        env:
          PACKAGE_FILE: ${{ steps.release.outputs.file }}
        run: npm publish "$PACKAGE_FILE" --ignore-scripts --access public --provenance
